name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-ci.txt
      - name: Unit tests
        run: python -m pytest -q
      - name: Mutation check (planted bugs must be caught)
        run: python scripts/mutation_check.py
      - name: README numbers match result files
        run: python scripts/check_readme.py
  security:
    runs-on: ubuntu-latest
    env:
      TRIVY: aquasec/trivy:0.76.0@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222
      GITLEAKS: zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0  # gitleaks reads every commit
      - name: Secrets in git history (gitleaks)
        run: docker run --rm -v "$PWD:/repo" "$GITLEAKS" git /repo --redact --no-banner
      - name: Python dependency CVEs (pip-audit)
        run: pipx run pip-audit==2.10.1 --progress-spinner off -r requirements-ci.txt -r requirements.txt
      - name: SAST (Semgrep; ERROR-severity findings fail the job)
        run: >
          pipx run semgrep==1.181.0 scan --metrics=off --error --severity ERROR
          --config p/default --config p/owasp-top-ten --config p/python --config p/secrets
      - name: Dependencies, compose file and secrets (Trivy; fixable HIGH and CRITICAL fail the job)
        run: >
          docker run --rm -v "$PWD:/src" -w /src "$TRIVY" fs --quiet --scanners vuln,misconfig,secret
          --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 .
